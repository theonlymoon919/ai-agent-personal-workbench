<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>AI Agent 个人工作台</title>
<style>
  *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:28px;background:#fffdfc;color:#243b31;font-family:system-ui,sans-serif}.card{max-width:420px;padding:30px 24px;border:1px solid #e4e2da;border-radius:24px;background:#f7faf7;box-shadow:0 18px 55px rgba(25,71,55,.08);text-align:center}.mark{display:grid;place-items:center;width:58px;height:58px;margin:0 auto 18px;border-radius:18px;background:#194737;color:#fff;font-size:28px}h1{margin:0 0 12px;font-size:25px}p{margin:0;color:#66736c;font-size:14px;line-height:1.8}.hint{margin-top:20px;padding:12px;border-radius:12px;background:#edf4ee;color:#37604a;font-size:13px}
</style>
<body><main class="card"><div class="mark">✦</div><h1>连接你的 AI Agent 个人工作台</h1><p>请输入部署完成后得到的工作台地址，并使用自己的账号登录。</p><div class="hint">点击顶部“连接设置”，粘贴以 https:// 开头的地址。不同账号的数据会彼此隔离。</div></main></body>
</html>
