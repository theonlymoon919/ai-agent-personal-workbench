name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  privacy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Repository privacy policy
        run: python scripts/privacy_scan.py --all
      - name: Gitleaks
        run: >-
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.28.0
          dir /repo --no-banner --redact --exit-code 1

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt pip-audit
      - name: Unit tests
        run: python -m unittest discover -s backend/tests -v
      - name: Dependency integrity
        run: python -m pip check
      - name: Python vulnerability audit
        run: python -m pip_audit -r backend/requirements.txt
      - name: Python license audit
        run: python scripts/license_audit.py --python

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high
      - name: Node license audit
        working-directory: .
        run: python scripts/license_audit.py --node frontend/node_modules

  migration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: workbench
          POSTGRES_USER: workbench_owner
          POSTGRES_PASSWORD: ci-owner-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U workbench_owner -d workbench"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      WORKBENCH_MIGRATION_DATABASE_URL: postgresql+psycopg://workbench_owner:ci-owner-password@127.0.0.1:5432/workbench
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install -r backend/requirements.txt
      - name: Create least-privilege runtime role
        run: >-
          docker exec "${{ job.services.postgres.id }}" psql -v ON_ERROR_STOP=1
          -U workbench_owner -d workbench
          -c "create role workbench_runtime login password 'ci-runtime-password'"
      - name: Upgrade an empty database to head
        run: alembic -c alembic.ini upgrade head
      - name: Verify migration head and forced RLS
        run: |
          alembic -c alembic.ini current
          python deploy/verify-database-security.py

  docker-and-first-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install -r backend/requirements.txt
      - name: Generate disposable environment
        run: python scripts/generate_env.py --output .env.ci --origin http://localhost:8787
      - name: Build and start from zero
        run: docker compose --env-file .env.ci up -d --build
      - name: Wait for health
        run: |
          for attempt in $(seq 1 40); do
            if curl --fail --silent http://127.0.0.1:8787/api/cloud/health >/dev/null; then
              exit 0
            fi
            sleep 3
          done
          docker compose --env-file .env.ci ps
          docker compose --env-file .env.ci logs --tail=100 workbench migrate postgres
          exit 1
      - name: First administrator, invitation, MCP, and tenant boundary
        run: python deploy/first-run-smoke-test.py --url http://127.0.0.1:8787
      - name: Full multi-tenant lifecycle smoke test
        run: docker compose --env-file .env.ci exec -T workbench python - < deploy/tenant-smoke-test.py
      - name: Cleanup disposable deployment
        if: always()
        run: |
          docker compose --env-file .env.ci down -v --remove-orphans
          rm -f .env.ci

  android-debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Build debug APK
        working-directory: mobile
        run: gradle --no-daemon clean assembleDebug
      - name: Ensure APK exists outside Git history
        run: test -f mobile/app/build/outputs/apk/debug/app-debug.apk
