name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}
      - uses: docker/build-push-action@v7
        env:
          # Build records embed the GitHub push payload, including private account email metadata.
          DOCKER_BUILD_RECORD_UPLOAD: "false"
          # Build summaries print the same event payload into the public Actions log.
          DOCKER_BUILD_SUMMARY: "false"
          # Buildx otherwise includes minimal GitHub-event provenance in its metadata output.
          BUILDX_METADATA_PROVENANCE: "disabled"
        with:
          context: .
          file: Dockerfile.cloud
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Do not publish an attestation containing the GitHub event payload.
          provenance: false

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Detect protected signing secrets
        id: signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if test -n "$ANDROID_KEYSTORE_BASE64" \
            && test -n "$ANDROID_KEY_ALIAS" \
            && test -n "$ANDROID_KEYSTORE_PASSWORD" \
            && test -n "$ANDROID_KEY_PASSWORD"; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Protected Android signing secrets are unavailable; publishing an explicitly named debug-signed alpha APK."
          fi
      - name: Build unsigned release APK
        if: steps.signing.outputs.enabled == 'true'
        working-directory: mobile
        run: gradle --no-daemon clean assembleRelease
      - name: Build debug-signed alpha APK
        if: steps.signing.outputs.enabled != 'true'
        working-directory: mobile
        run: gradle --no-daemon clean assembleDebug
      - name: Sign, verify, and checksum APK
        if: steps.signing.outputs.enabled == 'true'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          KEYSTORE="$RUNNER_TEMP/ai-agent-personal-workbench-release.jks"
          OUTPUT="AI-Agent-Personal-Workbench-Android-${GITHUB_REF_NAME}.apk"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE"
          chmod 600 "$KEYSTORE"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign \
            --ks "$KEYSTORE" \
            --ks-key-alias "$ANDROID_KEY_ALIAS" \
            --ks-pass env:ANDROID_KEYSTORE_PASSWORD \
            --key-pass env:ANDROID_KEY_PASSWORD \
            --out "$OUTPUT" \
            mobile/app/build/outputs/apk/release/app-release-unsigned.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$OUTPUT"
          sha256sum "$OUTPUT" > "$OUTPUT.sha256"
          rm -f "$KEYSTORE"
      - name: Verify and checksum debug-signed alpha APK
        if: steps.signing.outputs.enabled != 'true'
        run: |
          OUTPUT="AI-Agent-Personal-Workbench-Android-${GITHUB_REF_NAME}-debug.apk"
          cp mobile/app/build/outputs/apk/debug/app-debug.apk "$OUTPUT"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$OUTPUT"
          sha256sum "$OUTPUT" > "$OUTPUT.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: android-release
          path: |
            AI-Agent-Personal-Workbench-Android-*.apk
            AI-Agent-Personal-Workbench-Android-*.apk.sha256
          if-no-files-found: error

  github-release:
    needs: [image, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: android-release
          path: release-assets
      - name: Add Chinese installation guide
        run: cp docs/RELEASE_INSTALL.zh-CN.md release-assets/AI-Agent-Personal-Workbench-Install-Guide.zh-CN.md
      - uses: softprops/action-gh-release@v2
        with:
          body_path: docs/RELEASE_NOTES.md
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: release-assets/*
