name: personal-workbench

x-workbench-app: &workbench-app
  image: ${WORKBENCH_IMAGE:-personal-workbench}:${WORKBENCH_IMAGE_TAG:-local}
  build:
    context: .
    dockerfile: Dockerfile.cloud

x-workbench-environment: &workbench-environment
  WORKBENCH_DB_HOST: postgres
  WORKBENCH_DB_PORT: 5432
  WORKBENCH_DB_NAME: ${POSTGRES_DB:-workbench}
  WORKBENCH_DB_USER: workbench_runtime
  WORKBENCH_DB_PASSWORD: ${WORKBENCH_DB_RUNTIME_PASSWORD:?Set WORKBENCH_DB_RUNTIME_PASSWORD in .env}
  WORKBENCH_DB_POOL_SIZE: ${WORKBENCH_DB_POOL_SIZE:-3}
  WORKBENCH_DB_MAX_OVERFLOW: ${WORKBENCH_DB_MAX_OVERFLOW:-2}
  WORKBENCH_TOKEN_PEPPER: ${WORKBENCH_TOKEN_PEPPER:?Set WORKBENCH_TOKEN_PEPPER in .env}
  WORKBENCH_PUBLIC_ORIGIN: ${WORKBENCH_PUBLIC_ORIGIN:-http://localhost:8787}
  WORKBENCH_CLOUD_DATA_ROOT: /data/objects
  WORKBENCH_SECURE_COOKIES: ${WORKBENCH_SECURE_COOKIES:-false}

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-workbench}
      POSTGRES_USER: ${POSTGRES_USER:-workbench_owner}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      WORKBENCH_DB_RUNTIME_PASSWORD: ${WORKBENCH_DB_RUNTIME_PASSWORD:?Set WORKBENCH_DB_RUNTIME_PASSWORD in .env}
    command:
      - postgres
      - -c
      - max_connections=30
      - -c
      - shared_buffers=128MB
      - -c
      - work_mem=2MB
      - -c
      - maintenance_work_mem=32MB
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./deploy/postgres/init_roles.sh:/docker-entrypoint-initdb.d/10-init-roles.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    security_opt:
      - no-new-privileges:true
    shm_size: 128mb
    mem_limit: 384m
    pids_limit: 200

  migrate:
    <<: *workbench-app
    command: ["alembic", "-c", "/app/alembic.ini", "upgrade", "head"]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-workbench}
      POSTGRES_USER: ${POSTGRES_USER:-workbench_owner}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      WORKBENCH_DB_HOST: postgres
      WORKBENCH_DB_PORT: 5432
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    security_opt:
      - no-new-privileges:true
    mem_limit: 384m
    pids_limit: 160

  storage-init:
    image: alpine:3.22
    command: ["sh", "-c", "chown -R 10001:10001 /data/objects && chmod 0750 /data/objects"]
    volumes:
      - private-objects:/data/objects
    restart: "no"
    security_opt:
      - no-new-privileges:true
    mem_limit: 32m
    pids_limit: 32

  workbench:
    <<: *workbench-app
    restart: unless-stopped
    environment: *workbench-environment
    ports:
      - "127.0.0.1:${WORKBENCH_PORT:-8787}:8787"
    volumes:
      - private-objects:/data/objects
    depends_on:
      migrate:
        condition: service_completed_successfully
      storage-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8787/api/cloud/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 20s
    security_opt:
      - no-new-privileges:true
    mem_limit: 320m
    pids_limit: 200
    tmpfs:
      - /tmp:size=64m,noexec,nosuid,nodev

  worker:
    <<: *workbench-app
    command: ["python", "-m", "backend.cloud_worker"]
    restart: unless-stopped
    environment:
      <<: *workbench-environment
      WORKBENCH_DB_POOL_SIZE: 1
      WORKBENCH_DB_MAX_OVERFLOW: 0
    volumes:
      - private-objects:/data/objects
    depends_on:
      migrate:
        condition: service_completed_successfully
      storage-init:
        condition: service_completed_successfully
    security_opt:
      - no-new-privileges:true
    mem_limit: 192m
    pids_limit: 120
    tmpfs:
      - /tmp:size=32m,noexec,nosuid,nodev

volumes:
  postgres-data:
  private-objects:
